services:
  api:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://telemetry:telemetry@database:5432/telemetry
      USER_ID_HASH_SALT: ${USER_ID_HASH_SALT:-local-compose-only}
    ports:
      - "5000:5000"
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:5000/health/ready')",
        ]
      interval: 10s
      timeout: 3s
      retries: 5

  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: telemetry
      POSTGRES_USER: telemetry
      POSTGRES_PASSWORD: telemetry
    ports:
      - "5432:5432"
    volumes:
      - telemetry-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U telemetry -d telemetry"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  telemetry-data:

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 650" width="1060" height="650" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1060" height="650" fill="#FFFFFF"/>

  <text x="530" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1B2A4A">Curva de valor: diagnóstico de degradações no Globoplay</text>

  <g font-size="12" fill="#1B2A4A">
    <line x1="130" y1="55" x2="165" y2="55" stroke="#9AA0A6" stroke-width="3" stroke-dasharray="6 4"/>
    <circle cx="147" cy="55" r="4" fill="#9AA0A6"/>
    <text x="173" y="59">Prática atual (silos + triagem humana)</text>

    <line x1="420" y1="55" x2="455" y2="55" stroke="#2E7D9A" stroke-width="3" stroke-dasharray="2 4"/>
    <circle cx="437" cy="55" r="4" fill="#2E7D9A"/>
    <text x="463" y="59">Suíte de observabilidade de mercado</text>

    <line x1="700" y1="55" x2="735" y2="55" stroke="#E8384F" stroke-width="4"/>
    <circle cx="717" cy="55" r="5" fill="#E8384F"/>
    <text x="743" y="59">Solução proposta pelo grupo</text>
  </g>

  <g stroke="#E3E3E8" stroke-width="1">
    <line x1="180" y1="80" x2="1010" y2="80"/>
    <line x1="180" y1="165" x2="1010" y2="165"/>
    <line x1="180" y1="250" x2="1010" y2="250"/>
    <line x1="180" y1="335" x2="1010" y2="335"/>
    <line x1="180" y1="420" x2="1010" y2="420"/>
  </g>
  <line x1="180" y1="80" x2="180" y2="420" stroke="#B9B9C2" stroke-width="1.5"/>
  <line x1="180" y1="420" x2="1010" y2="420" stroke="#B9B9C2" stroke-width="1.5"/>

  <g font-size="12" fill="#6B6B78" text-anchor="end">
    <text x="168" y="84">5</text>
    <text x="168" y="169">4</text>
    <text x="168" y="254">3</text>
    <text x="168" y="339">2</text>
    <text x="168" y="424">1</text>
  </g>
  <text x="140" y="250" font-size="12" fill="#6B6B78" text-anchor="middle" transform="rotate(-90 140 250)">Entrega de valor percebido</text>

  <polyline fill="none" stroke="#9AA0A6" stroke-width="3" stroke-dasharray="6 4"
    points="200,420 310,420 420,335 530,335 640,335 750,420 860,250 970,80"/>
  <g fill="#9AA0A6">
    <circle cx="200" cy="420" r="4.5"/>
    <circle cx="310" cy="420" r="4.5"/>
    <circle cx="420" cy="335" r="4.5"/>
    <circle cx="530" cy="335" r="4.5"/>
    <circle cx="640" cy="335" r="4.5"/>
    <circle cx="750" cy="420" r="4.5"/>
    <circle cx="860" cy="250" r="4.5"/>
    <circle cx="970" cy="80" r="4.5"/>
  </g>

  <polyline fill="none" stroke="#2E7D9A" stroke-width="3" stroke-dasharray="2 4"
    points="200,250 310,250 420,250 530,335 640,335 750,250 860,165 970,250"/>
  <g fill="#2E7D9A">
    <circle cx="200" cy="250" r="4.5"/>
    <circle cx="310" cy="250" r="4.5"/>
    <circle cx="420" cy="250" r="4.5"/>
    <circle cx="530" cy="335" r="4.5"/>
    <circle cx="640" cy="335" r="4.5"/>
    <circle cx="750" cy="250" r="4.5"/>
    <circle cx="860" cy="165" r="4.5"/>
    <circle cx="970" cy="250" r="4.5"/>
  </g>

  <polyline fill="none" stroke="#E8384F" stroke-width="4"
    points="200,80 310,80 420,80 530,80 640,80 750,165 860,250 970,335"/>
  <g fill="#E8384F">
    <circle cx="200" cy="80" r="5.5"/>
    <circle cx="310" cy="80" r="5.5"/>
    <circle cx="420" cy="80" r="5.5"/>
    <circle cx="530" cy="80" r="5.5"/>
    <circle cx="640" cy="80" r="5.5"/>
    <circle cx="750" cy="165" r="5.5"/>
    <circle cx="860" cy="250" r="5.5"/>
    <circle cx="970" cy="335" r="5.5"/>
  </g>

  <g font-size="12.5" fill="#1B2A4A" text-anchor="end">
    <text transform="translate(200,438) rotate(-35)">1. Tempo até a hipótese de causa</text>
    <text transform="translate(310,438) rotate(-35)">2. Correlação ponta a ponta</text>
    <text transform="translate(420,438) rotate(-35)">3. Detecção de degradação sem erro</text>
    <text transform="translate(530,438) rotate(-35)">4. Granularidade dos recortes</text>
    <text transform="translate(640,438) rotate(-35)">5. Cobertura de dispositivos e protocolos</text>
    <text transform="translate(750,438) rotate(-35)">6. Independência de especialista</text>
    <text transform="translate(860,438) rotate(-35)">7. Sustentação em pico ao vivo</text>
    <text transform="translate(970,438) rotate(-35)">8. Baixo esforço de implantação</text>
  </g>

  <text x="530" y="625" text-anchor="middle" font-size="12" fill="#6B6B78">Escala de 1 (baixa entrega de valor) a 5 (alta entrega de valor). No atributo 8, nota alta indica menor esforço e menor custo de propriedade.</text>
</svg>
# No kind quem serve o Ingress e o ingress-nginx, nao o controlador de ALB do
# EKS Auto Mode. A regra de roteamento (/ -> frontend, /api -> backend) vem
# inteira da base: so a classe muda.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: argus
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "51m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
spec:
  ingressClassName: nginx

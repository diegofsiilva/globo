# Ambiente AWS: cluster EKS Auto Mode na VPC do Argus, RDS como banco.
#
#   make k8s-apply            # K8S_OVERLAY=aws e o padrao
#
# O Secret `argus-backend` NAO e gerado aqui. Ele e criado por `make k8s-secret`,
# que le os outputs do Terraform e canaliza por pipe para o kubectl -- o valor
# nunca toca o disco nem o repositorio. Ver k8s/README.md.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: argus

resources:
  - ../../base
  - ingressclass.yaml

patches:
  - path: ingress-patch.yaml
  - path: placement-patch.yaml

# Os placeholders IMAGE_BACKEND, IMAGE_FRONTEND e IMAGE_PROCESSING sao
# substituidos por `make k8s-apply` pela referencia completa da imagem, lida de
# `terraform output ecr_repository_urls`. Nem a conta nem o nome do repositorio
# aparecem aqui: a conta do Learner Lab muda a cada sessao, e o nome do
# repositorio vem de `local.name` no Terraform.

# Pipeline do Argus no GitLab (git.inteli.edu.br).
#
# Este arquivo NAO fica na raiz do repositorio: a raiz e fixa por exigencia
# academica. Por isso o projeto precisa apontar para ele em
#   Settings -> CI/CD -> General pipelines -> "CI/CD configuration file"
#   = apps/fullstack/.gitlab-ci.yml
# Sem essa configuracao o GitLab procura `.gitlab-ci.yml` na raiz e nenhum
# pipeline roda. Todo `script` faz `cd` explicito por causa disso.
#
# O pipeline e o equivalente de `make -C apps/fullstack check` (ver o alvo
# `check` no Makefile), distribuido em tres estagios:
#
#   lint   ruff nos apps Python (mesmos comandos do alvo `lint`), eslint +
#          tsc no dashboard, `terraform fmt -check` na infra.
#   test   uma suite pytest por app Python, com PostgreSQL 16 de servico onde
#          o conftest pede `TEST_DATABASE_URL`; vitest no dashboard; a
#          validacao estatica da observabilidade.
#   build  `kubectl kustomize` + verifica_manifests.py, `terraform validate` e
#          `terraform test` (sem backend, sem AWS), `next build` com URL de
#          placeholder, e o build das imagens Docker (manual, so onde o runner
#          tem docker-in-docker).
#
# O que o `make check` roda e AQUI nao entra: `test-frontend-e2e` (Playwright
# contra Flask + PostgreSQL local; o proprio alvo se pula sem docker).

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH == "main"
    - if: $CI_PIPELINE_SOURCE == "web"

stages:
  - lint
  - test
  - build

default:
  interruptible: true

variables:
  APP_DIR: apps/fullstack
  # uv 0.8 e a versao que o projeto usa; os uv.lock foram gerados por ela.
  UV_SPEC: "uv>=0.8,<0.9"
  UV_CACHE_DIR: $CI_PROJECT_DIR/.cache/uv
  UV_LINK_MODE: copy
  # A imagem ja traz o 3.12: nao ha por que o uv baixar outro interpretador.
  UV_PYTHON_DOWNLOADS: never
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_ROOT_USER_ACTION: ignore
  npm_config_cache: $CI_PROJECT_DIR/.cache/npm
  NEXT_TELEMETRY_DISABLED: "1"
  TF_IN_AUTOMATION: "1"
  TF_INPUT: "0"
  TF_PLUGIN_CACHE_DIR: $CI_PROJECT_DIR/.cache/terraform
  KUBECTL_VERSION: v1.31.14
  # Valores de teste: o Postgres de servico e descartavel e morre com o job.
  POSTGRES_USER: argus
  POSTGRES_PASSWORD: argus
  POSTGRES_DB: argus_test

# --------------------------------------------------------------------------- #
# Templates
# --------------------------------------------------------------------------- #

# Apps Python: python:3.12-slim + uv via pip. Alternativa equivalente, se o
# runner enxergar o ghcr.io: `image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim`
# e tirar o `pip install`.
.uv:
  image: python:3.12-slim
  before_script:
    - python -m pip install --quiet "$UV_SPEC"
    - uv --version
  cache:
    key: uv-$APP
    paths:
      - .cache/uv

# Suites que falam com o banco. O conftest de backend, worker e processing
# PULA os testes de banco quando `TEST_DATABASE_URL` nao existe ou o Postgres
# nao responde em 2s -- num runner isso viraria "verde" sem testar nada. A
# espera abaixo transforma o Postgres ausente em falha do job. As migrations
# sao aplicadas pelo proprio conftest (tools/migrate.py), por isso a URL do
# banco de teste tambem vai em DATABASE_URL.
.pytest-db:
  extends: .uv
  services:
    - name: postgres:16
      alias: postgres
  variables:
    TEST_DATABASE_URL: postgresql://argus:argus@postgres:5432/argus_test
    DATABASE_URL: postgresql://argus:argus@postgres:5432/argus_test
  before_script:
    - python -m pip install --quiet "$UV_SPEC"
    - uv --version
    - cd $CI_PROJECT_DIR/$APP_DIR/$APP
    - |
      uv run --quiet python - <<'EOF'
      import os, sys, time
      import psycopg
      url = os.environ["TEST_DATABASE_URL"]
      erro = None
      for _ in range(30):
          try:
              with psycopg.connect(url, connect_timeout=2):
                  print("PostgreSQL pronto")
                  sys.exit(0)
          except psycopg.OperationalError as exc:
              erro = exc
              time.sleep(2)
      sys.exit(f"PostgreSQL nao respondeu em 60s: {erro}")
      EOF

# Dashboard: Node 20 + npm ci a partir do package-lock.json.
.node:
  image: node:20
  before_script:
    - cd $CI_PROJECT_DIR/$APP_DIR/frontend
    - npm ci --no-audit --no-fund
  cache:
    key:
      files:
        - apps/fullstack/frontend/package-lock.json
    paths:
      - .cache/npm

# Infra. `required_version >= 1.9`, mas o rede.tftest.hcl usa
# `override_during`, que so existe a partir do Terraform 1.11 -- com a imagem
# 1.9 ate o `validate` falha ao carregar o arquivo de teste. 1.15 e a versao
# com que o `make check` roda hoje.
.terraform:
  image:
    name: hashicorp/terraform:1.15
    entrypoint: [""]
  before_script:
    - cd $CI_PROJECT_DIR/$APP_DIR/infra
    - mkdir -p "$TF_PLUGIN_CACHE_DIR"
    - terraform version
  cache:
    key: terraform-providers
    paths:
      - .cache/terraform

# --------------------------------------------------------------------------- #
# lint
# --------------------------------------------------------------------------- #

# Mesmas linhas do alvo `lint` do Makefile. O `ruff format --check` so entra
# onde o Makefile ja o roda (tools, worker, processing): loader e backend ainda
# tem arquivos fora do formato e passariam a barrar o pipeline sem barrar o
# `make lint`. O backend leva `--extra dev` porque o ruff dele e optional
# dependency, nao grupo -- num ambiente novo o `uv run ruff` puro nao o acha.
lint:python:
  stage: lint
  extends: .uv
  variables:
    APP: lint
  script:
    - cd $CI_PROJECT_DIR/$APP_DIR/tools && uv run --quiet ruff check . && uv run --quiet ruff format --check .
    - cd $CI_PROJECT_DIR/$APP_DIR/common && uv run --quiet --with ruff ruff check src
    - cd $CI_PROJECT_DIR/$APP_DIR/worker && uv run --quiet ruff check src tests && uv run --quiet ruff format --check src tests
    - cd $CI_PROJECT_DIR/$APP_DIR/simulator && uv run --quiet ruff check src
    - cd $CI_PROJECT_DIR/$APP_DIR/processing && uv run --quiet ruff check src tests && uv run --quiet ruff format --check src tests
    - cd $CI_PROJECT_DIR/$APP_DIR/loader && uv run --quiet ruff check src
    - cd $CI_PROJECT_DIR/$APP_DIR/backend && uv run --quiet --extra dev ruff check src tests
    - cd $CI_PROJECT_DIR/$APP_DIR/authorizer && uv run --quiet --with ruff ruff check handler.py tests

lint:frontend:
  stage: lint
  extends: .node
  script:
    - npm run lint
    - npx tsc --noEmit

lint:terraform:
  stage: lint
  extends: .terraform
  script:
    - terraform fmt -check -recursive -diff

# --------------------------------------------------------------------------- #
# test
# --------------------------------------------------------------------------- #

# `-rs` lista os testes pulados com o motivo: e como se ve, no log, se algum
# skip de banco sobreviveu a espera do template.
test:backend:
  stage: test
  extends: .pytest-db
  variables:
    APP: backend
  script:
    - cd $CI_PROJECT_DIR/$APP_DIR/backend
    - uv run --quiet --extra dev pytest -rs --junitxml=report.xml --cov=telemetry --cov-report=term --cov-report=xml:coverage.xml
  coverage: '/TOTAL.*\s+(\d+%)$/'
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - apps/fullstack/backend/report.xml
      - apps/fullstack/backend/coverage.xml
    reports:
      junit: apps/fullstack/backend/report.xml
      coverage_report:
        coverage_format: cobertura
        path: apps/fullstack/backend/coverage.xml

test:worker:
  stage: test
  extends: .pytest-db
  variables:
    APP: worker
  script:
    - cd $CI_PROJECT_DIR/$APP_DIR/worker
    - uv run --quiet pytest -rs --junitxml=report.xml
  artifacts:
    when: always
    expire_in: 1 week
    reports:
      junit: apps/fullstack/worker/report.xml

test:processing:
  stage: test
  extends: .pytest-db
  variables:
    APP: processing
  script:
    - cd $CI_PROJECT_DIR/$APP_DIR/processing
    - uv run --quiet pytest -rs --junitxml=report.xml
  artifacts:
    when: always
    expire_in: 1 week
    reports:
      junit: apps/fullstack/processing/report.xml

test:simulator:
  stage: test
  extends: .uv
  variables:
    APP: simulator
  script:
    - cd $CI_PROJECT_DIR/$APP_DIR/simulator
    - uv run --quiet pytest --junitxml=report.xml
  artifacts:
    when: always
    expire_in: 1 week
    reports:
      junit: apps/fullstack/simulator/report.xml

# O handler cria o cliente do Secrets Manager no import e o botocore exige uma
# regiao para construi-lo (nenhuma chamada sai daqui). Mesmo motivo do alvo
# `test-authorizer` do Makefile.
test:authorizer:
  stage: test
  extends: .uv
  variables:
    APP: authorizer
    AWS_DEFAULT_REGION: us-east-1
  script:
    - cd $CI_PROJECT_DIR/$APP_DIR/authorizer
    - uv run --quiet --group dev pytest --junitxml=report.xml
  artifacts:
    when: always
    expire_in: 1 week
    reports:
      junit: apps/fullstack/authorizer/report.xml

# O Makefile roda esta suite com unittest (`test-hypothesis-batch`); aqui o
# pytest a executa, sem mudar nada nela, para produzir o JUnit. `tools` nao
# tem pytest no grupo dev, dai o `--with`.
test:tools:
  stage: test
  extends: .uv
  variables:
    APP: tools
  script:
    - cd $CI_PROJECT_DIR/$APP_DIR/tools
    - uv run --quiet --with "pytest>=8.3,<9" python -m pytest tests/test_hypothesis_batch.py --junitxml=report.xml
  artifacts:
    when: always
    expire_in: 1 week
    reports:
      junit: apps/fullstack/tools/report.xml

test:frontend:
  stage: test
  extends: .node
  script:
    - npx vitest run --reporter=default --reporter=junit --outputFile=report.xml
  artifacts:
    when: always
    expire_in: 1 week
    reports:
      junit: apps/fullstack/frontend/report.xml

# Alvo `test-observabilidade`: sintaxe do script de carga e JSON dos paineis.
# O `docker compose config` e pulado como no Makefile sem Docker.
test:observabilidade:
  stage: test
  image: python:3.12-slim
  script:
    - cd $CI_PROJECT_DIR/$APP_DIR
    - bash -n tests/carga/executar_testes.sh
    - echo "  compose pulado - Docker ausente."
    - for painel in observability/grafana/dashboards/*.json; do python3 -m json.tool "$painel" >/dev/null || exit 1; echo "  $painel ok"; done

# --------------------------------------------------------------------------- #
# build
# --------------------------------------------------------------------------- #

# Alvo `k8s-validate`: renderiza os cinco overlays e roda o verificador das
# invariantes que o kustomize nao alcanca. O overlay `kind` le um `secret.env`
# gitignored; aqui ele nasce do `.example`, como o k8s/README.md manda fazer
# localmente. O kubectl vem do dl.k8s.io com o checksum conferido -- a imagem
# slim nao tem curl, e o urllib basta.
build:k8s-validate:
  stage: build
  image: python:3.12-slim
  script:
    - |
      python3 - <<'EOF'
      import hashlib, os, platform, urllib.request
      versao = os.environ["KUBECTL_VERSION"]
      arch = {"x86_64": "amd64", "aarch64": "arm64", "arm64": "arm64"}[platform.machine()]
      base = f"https://dl.k8s.io/release/{versao}/bin/{platform.system().lower()}/{arch}/kubectl"
      binario = urllib.request.urlopen(base, timeout=60).read()
      esperado = urllib.request.urlopen(base + ".sha256", timeout=60).read().decode().split()[0]
      obtido = hashlib.sha256(binario).hexdigest()
      if obtido != esperado:
          raise SystemExit(f"checksum do kubectl nao confere: {obtido} != {esperado}")
      destino = os.environ.get("KUBECTL_DEST", "/usr/local/bin/kubectl")
      with open(destino, "wb") as f:
          f.write(binario)
      os.chmod(destino, 0o755)
      print(f"kubectl {versao} ({arch}) instalado em {destino}")
      EOF
    - kubectl version --client
    - cd $CI_PROJECT_DIR/$APP_DIR
    - cp -n k8s/overlays/kind/secret.env.example k8s/overlays/kind/secret.env
    - for alvo in base migrate overlays/aws overlays/kind overlays/kind/migrate; do printf '  %-24s ' "$alvo"; kubectl kustomize "k8s/$alvo" > /dev/null || exit 1; echo ok; done
    - python3 tools/verifica_manifests.py --k8s k8s --makefile Makefile --kubectl kubectl

# Alvo `tf-validate`. `-backend=false` porque o backend.tf e gitignored e o
# estado remoto nao interessa aqui; os providers vem do .terraform.lock.hcl.
build:terraform:
  stage: build
  extends: .terraform
  script:
    - terraform init -backend=false -input=false -no-color
    - terraform validate -no-color

# Alvo `tf-test`: plano real com `mock_provider "aws"`, sem tocar na AWS.
#
# allow_failure ate o teste voltar a passar: hoje o run "topologia" falha
# porque o provider valida o JSON de `assume_role_policy` e
# o rede.tftest.hcl so faz `override_data` de duas policy documents (as dos
# buckets). Faltam `lambda_assume[0]`, `apigw_assume` e `ecs_assume`, que os
# cinco `aws_iam_role` do plano leem. E' falha do teste, nao da infra, e
# reproduz local com `make -C apps/fullstack tf-test`. Ao corrigir o tftest,
# remova o `allow_failure`.
build:terraform-test:
  stage: build
  extends: .terraform
  allow_failure: true
  script:
    - terraform init -backend=false -input=false -no-color
    - terraform test -no-color

# Alvo `frontend-build-check`: compila o dashboard com URL de placeholder. O
# objetivo e compilar (tipos dos Server Components, geracao das rotas), nao
# falar com a API -- o build falha de proposito sem NEXT_PUBLIC_API_URL.
build:frontend:
  stage: build
  extends: .node
  variables:
    NEXT_PUBLIC_API_URL: https://api.invalido.local
    NEXT_PUBLIC_HYPOTHESES_SOURCE: mock
  cache:
    - key:
        files:
          - apps/fullstack/frontend/package-lock.json
      paths:
        - .cache/npm
    - key: next-cache
      paths:
        - apps/fullstack/frontend/.next/cache
  script:
    - npm run build

# Build das seis imagens (alvo `images`), so como fumaca: nao publica, nao
# faz multi-arch. Manual e allow_failure porque exige um runner com
# docker-in-docker, que o projeto pode nao ter. O contexto segue o Makefile:
# backend e frontend usam o proprio diretorio; o resto usa apps/fullstack
# inteiro para enxergar ../common.
build:images:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: /certs
    DOCKER_BUILDKIT: "1"
  rules:
    - when: manual
  allow_failure: true
  script:
    - cd $CI_PROJECT_DIR/$APP_DIR
    - GIT_SHA=$(echo "$CI_COMMIT_SHA" | cut -c1-12)
    - |
      for nome in worker simulator processing loader backend frontend; do
        contexto="."
        case " backend frontend " in *" $nome "*) contexto="$nome";; esac
        extra=""
        case "$nome" in frontend) extra="--build-arg NEXT_PUBLIC_HYPOTHESES_SOURCE=api";; esac
        echo "--- $nome (contexto $contexto)"
        docker build -f "$nome/Dockerfile" -t "argus-$nome:$GIT_SHA" \
          --build-arg GIT_SHA="$GIT_SHA" $extra "$contexto" || exit 1
      done
    - docker images "argus-*"

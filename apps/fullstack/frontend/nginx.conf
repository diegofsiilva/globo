# Servidor do export estatico do dashboard.
#
# Roda como usuario sem privilegio, e por isso escuta em 8080 e nao em 80:
# portas abaixo de 1024 exigem CAP_NET_BIND_SERVICE, que seria privilegio a
# mais so para servir HTML. O Service do Kubernetes publica 80 e encaminha
# para 8080, entao quem consome nao ve diferenca.

worker_processes auto;

# Tudo que o nginx escreve vai para /tmp: o resto do sistema de arquivos e
# somente-leitura (readOnlyRootFilesystem no Deployment), e um nginx que nao
# consegue gravar o pid nem sobe.
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  client_body_temp_path /tmp/client_temp;
  proxy_temp_path       /tmp/proxy_temp;
  fastcgi_temp_path     /tmp/fastcgi_temp;
  uwsgi_temp_path       /tmp/uwsgi_temp;
  scgi_temp_path        /tmp/scgi_temp;

  # Log em stdout/stderr, e nao em arquivo: quem coleta e o kubectl logs.
  access_log /dev/stdout;
  error_log  /dev/stderr warn;

  sendfile      on;
  tcp_nopush    on;
  server_tokens off;

  gzip              on;
  gzip_vary         on;
  gzip_min_length   1024;
  gzip_proxied      any;
  gzip_types        text/plain text/css application/javascript application/json
                    image/svg+xml font/woff2;

  server {
    listen      8080;

    # Sem isto, a barra final que o `try_files ... $uri/` acrescenta vira um
    # 301 com host e porta do container (`http://<host>:8080/agora/`). Atras
    # do ALB do Ingress a porta 8080 nao existe, e um link direto ou um F5
    # em qualquer tela ficava pendurado. Com `absolute_redirect off` o
    # `Location` sai relativo (`/agora/`) e o navegador segue no mesmo host.
    absolute_redirect off;
    server_name _;
    root        /usr/share/nginx/html;

    # O Next foi exportado com `trailingSlash: true`, entao cada rota e uma
    # pasta com index.html dentro. Sem o `$uri/index.html` aqui, /agora/
    # responderia 404 mesmo com o arquivo no lugar certo.
    location / {
      try_files $uri $uri/ $uri/index.html =404;
    }

    # Os assets do Next carregam hash no nome, entao podem ser cacheados para
    # sempre. O HTML nao: e ele que aponta para o bundle novo depois de um
    # deploy, e um cache longo aqui serviria a versao velha indefinidamente.
    location /_next/static/ {
      expires    1y;
      add_header Cache-Control "public, immutable";
    }

    # Alvo da liveness/readiness probe. Responde sem tocar em disco, para que a
    # probe meca o nginx e nao o sistema de arquivos.
    location = /healthz {
      access_log   off;
      # `default_type` e nao `add_header Content-Type`: o `return` encerra a
      # requisicao ali mesmo, e um add_header depois dele nao chega a ser
      # aplicado -- a resposta sai como text/html.
      default_type text/plain;
      return       200 "ok\n";
    }

    # A MESMA rota de saude do backend, respondida localmente.
    #
    # A anotacao `alb.ingress.kubernetes.io/healthcheck-path` do Ingress vale
    # para TODOS os target groups daquele balanceador, inclusive o do frontend.
    # Sem esta rota, o TG do frontend levaria 404 em /health/live e ficaria com
    # zero alvos saudaveis -- e o sintoma apareceria como "o dashboard nao abre",
    # longe da anotacao que o causou.
    location = /health/live {
      access_log   off;
      default_type application/json;
      return       200 '{"status":"ok"}';
    }

    error_page 404 /404.html;
  }
}

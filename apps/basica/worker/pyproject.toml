[project]
name = "argus-worker"
version = "0.1.0"
description = "Workers de ingestao do Argus: SQS -> PostgreSQL (change events e grain de sessao)"
requires-python = ">=3.12"
dependencies = [
    "argus-common",
    "boto3>=1.35",
    "pydantic>=2.9",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "moto[sqs]>=5.0",
    "ruff>=0.6",
]

# O pacote comum vem do diretorio irmao. E por isso que o build da imagem usa
# apps/basica/ como contexto, e nao worker/: sem enxergar ../common, o `uv sync`
# dentro do container nao teria como resolver esta dependencia.
[tool.uv.sources]
argus-common = { path = "../common", editable = false }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/argus_worker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["error::DeprecationWarning:argus_worker.*"]

[tool.ruff]
line-length = 90
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

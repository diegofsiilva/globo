# Provisiona os dashboards do Grafana a partir do diretório local.
apiVersion: 1

providers:
  - name: "argus-k6"
    orgId: 1
    folder: "Argus — Testes de Carga"
    type: file
    disableDeletion: false
    editable: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false

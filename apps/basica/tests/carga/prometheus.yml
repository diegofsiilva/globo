# Configuração do Prometheus para coletar métricas dos testes k6.
#
# O k6 envia métricas via Remote Write para o endpoint
# http://prometheus:9090/api/v1/write quando executado com:
#
#   K6_PROMETHEUS_RW_SERVER_URL=http://localhost:9090/api/v1/write \
#   k6 run -o experimental-prometheus-rw script.js

global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  # Métricas do próprio Prometheus.
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

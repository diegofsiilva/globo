[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "telemetry-backend"
version = "0.1.0"
description = "API de ingestao e consulta de telemetria multiplataforma"
requires-python = ">=3.12"
dependencies = [
  "Flask>=3.1,<4",
  "gunicorn>=23,<24",
  "apig-wsgi>=2.18,<3",
  # `binary` traz a libpq compilada: sem isso o pacote da Lambda precisaria de
  # uma layer com a biblioteca do sistema, e o zip deixaria de ser
  # auto-contido. `pool` porque a Lambda reusa a conexao entre invocacoes na
  # mesma execucao quente.
  "psycopg[binary,pool]>=3.2,<4",
]

# boto3 saiu: a API nao fala mais com servico nenhum da AWS. Ela le do
# PostgreSQL, e a autorizacao vem de GRANT, nao de IAM. Sao ~15 MB a menos no
# zip da Lambda.

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.11,<1",
  # Os testes montam as linhas com o MESMO codigo que o worker usa
  # (argus_worker.keys.build_row, que valida com pydantic) em vez de com um
  # formato conveniente. E o que impede a API e o worker de divergirem em
  # silencio sobre o que e coluna do envelope e o que vai para o payload.
  "pydantic>=2.9,<3",
]

# `moto` saiu junto com o DynamoDB. Os testes agora rodam contra um PostgreSQL
# de verdade (`make db-local`), e nao contra um duble -- a parte dificil deste
# adaptador e o SQL, e um duble testaria apenas o duble.

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# Os testes importam `tests.conftest`. Sem isto, `pytest` como executável falha
# na coleção, embora `python -m pytest` funcione — este último insere o
# diretório atual no path e o primeiro não.
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "D"]

# `D` (pydocstyle) transforma a convencao do AGENTS.md ("todo modulo, classe,
# funcao e metodo documentado") em algo que o `make check` verifica. Sem isto a
# regra dependia de revisao humana, e 78 funcoes tinham passado sem docstring.
#
# Convencao Google: e a que os Args/Returns/Raises do repositorio ja seguem.
[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Testes descrevem o cenario no NOME e, quando precisam, num comentario. Exigir
# docstring em cada `test_*` produziria centenas de linhas que repetem o nome da
# funcao -- ruido que ensina a ignorar o proprio aviso.
"tests/**" = [
  "D100", "D101", "D102", "D103", "D104",
  # Estilo de docstring tambem sai. O docstring de um teste e prosa que explica
  # o CENARIO ("so os buckets seguidos acima do limiar, contados do fim pra
  # tras"), e a frase util raramente cabe numa linha de resumo. Espremer isso
  # no formato de API pioraria o texto que existe para ser lido.
  "D205", "D209", "D400", "D401", "D403", "D415",
  # `__init__` de dublê e docstring que abre com uma string citada
  # (`""" "unknown" e valor REAL do parque`) tambem ficam de fora: o primeiro
  # nao tem o que documentar alem do proprio nome da classe, e o segundo e uma
  # citacao intencional do valor testado.
  "D107", "D210",
]

[project]
name = "argus-processing"
version = "0.1.0"
description = "ETL incremental, detector, canario e motor de hipoteses do Argus"
requires-python = ">=3.12"
dependencies = ["argus-common"]

[project.scripts]
analysisctl = "argus_processing.analysisctl:main"

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.6"]

[tool.uv.sources]
argus-common = { path = "../common", editable = false }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/argus_processing"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 90
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

# Datasource CloudWatch para o Grafana local dos testes de resiliencia
# (RNF04/05/11). Le credenciais do arquivo compartilhado do host (perfil g4
# do AWS Academy Learner Lab), montado read-only no container -- nao ha
# access key nem secret aqui, so a referencia ao arquivo/perfil.
apiVersion: 1

datasources:
  - name: CloudWatch
    uid: cloudwatch-g4
    type: cloudwatch
    access: proxy
    isDefault: true
    editable: true
    jsonData:
      authType: credentials
      profile: g4
      defaultRegion: us-east-1

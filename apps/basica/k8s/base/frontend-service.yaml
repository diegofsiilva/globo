# Service do dashboard.
#
# A porta publicada e 80, mas o container escuta em 8080: o nginx roda como
# usuario sem privilegio e portas abaixo de 1024 exigiriam CAP_NET_BIND_SERVICE.
# O Service traduz, e quem consome nao ve a diferenca.
apiVersion: v1
kind: Service
metadata:
  name: argus-frontend
  labels:
    app.kubernetes.io/name: argus-frontend
    app.kubernetes.io/part-of: argus
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: argus-frontend
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
